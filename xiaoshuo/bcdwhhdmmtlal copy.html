<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小说名</title>
<style>
  :root {
    --bg: #faf8f5;
    --fg: #2b2b2b;
    --muted: #888;
    --accent: #8a5a2b;
    --line: #e0d8cc;
    --bar-bg: rgba(250, 248, 245, 0.9);
    --danger: #c0392b;
  }
  body.night {
    --bg: #1a1a1a;
    --fg: #c9c9c9;
    --muted: #888;
    --accent: #c9a06a;
    --line: #333;
    --bar-bg: rgba(26, 26, 26, 0.9);
    --danger: #e74c3c;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0 auto;
    padding: 0 16px 40px;
    max-width: 720px;
    background: var(--bg);
    color: var(--fg);
    font: 18px/1.9 "Georgia", "Songti SC", "SimSun", serif;
    transition: background .3s, color .3s;
  }

  /* 美化滚动条 */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: rgba(150, 150, 150, 0.2);
    border-radius: 10px;
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  /* ===== 顶部阅读进度线 ===== */
  #progress-bar {
    position: fixed;
    top: 0;
    left: 0;
    height: 3px;
    background: var(--accent);
    width: 0%;
    z-index: 100;
    transition: width 0.1s;
  }

  /* ===== 顶部工具栏 ===== */
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    gap: 8px;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    background: var(--bar-bg);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .toolbar-right { display: flex; gap: 8px; }
  .toolbar button {
    padding: 6px 12px;
    font-size: 14px;
    cursor: pointer;
    background: transparent;
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 6px;
    transition: all .2s;
  }
  .toolbar button:hover { border-color: var(--accent); color: var(--accent); }

  /* 隐藏的返回按钮 */
  #topBack { display: none; }
  #topBack.show { display: block; }

  /* ===== 首页头部信息 ===== */
  .book-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin: 24px 0 32px;
  }
  .book-info h1 { font-size: 26px; margin: 0 0 8px; letter-spacing: 1px; }
  .book-info .subtitle { color: var(--muted); font-size: 14px; }
  
  /* 清空记录按钮 */
  #btnClear {
    font-size: 13px;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--line);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all .2s;
    font-family: system-ui, sans-serif;
  }
  #btnClear:hover {
    color: var(--danger);
    border-color: var(--danger);
  }

  /* ===== 目录列表 ===== */
  #toc {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  #toc li {
    padding: 14px 8px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background .2s, padding-left .2s;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  #toc li:hover {
    background: rgba(138, 90, 43, .06);
    padding-left: 16px;
    color: var(--accent);
  }
  
  /* 目录里的进度标签 */
  .toc-progress {
    font-size: 12px;
    color: var(--muted);
    background: var(--line);
    padding: 2px 8px;
    border-radius: 12px;
    white-space: nowrap;
    font-family: system-ui, sans-serif;
  }
  .toc-progress.done {
    color: #fff;
    background: var(--accent);
  }

  /* ===== 阅读区 ===== */
  #reader { padding-top: 16px; position: relative; }
  
  #chapterTitle {
    font-size: 22px;
    margin: 16px 0 32px;
    text-align: center;
    color: var(--accent);
    font-weight: normal;
  }

  #content { animation: fadeIn .4s ease both; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* 正文排版 */
  #content p {
    margin: 0 0 1em;
    text-indent: 2em;
    line-height: 1.9;
    text-align: justify;
  }

  /* 底部翻页栏 */
  .bar {
    display: flex;
    gap: 10px;
    justify-content: space-between;
    margin: 40px 0 0;
    padding-top: 20px;
    border-top: 1px solid var(--line);
  }
  .bar button {
    flex: 1;
    padding: 12px;
    font-size: 15px;
    cursor: pointer;
    background: transparent;
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 8px;
    transition: all .2s;
  }
  .bar button:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(138, 90, 43, .06);
  }
  .bar button:disabled { opacity: .35; cursor: not-allowed; }

  .hidden { display: none !important; }

  @media (max-width: 600px) {
    body { font-size: 17px; padding: 0 14px 40px; }
    .book-header { flex-direction: column; align-items: flex-start; gap: 16px; }
  }
</style>
</head>

        <p>西尔莎叼着一只甲壳虫，肥墩墩地坐到随喜跟前，和她分享这个玩具。</p>
        <p>西尔莎是一只圆滚滚的肥美小狮子。</p>
        <p>比随喜大一个月，不过随喜吃得太好，营养充足，体型上倒是和它差不多。</p>
        <p>这不是随喜开天眼，而是听到拍摄团队聊天知道的信息。</p>
        <p>这个拍摄团队已经跟踪拍摄狮群七八年了，一直在记录着狮群一代代的故事。</p>
        <p>她所在的狮群叫蕾拉狮群，是由上一代传奇母狮蕾拉命名，哪怕有了很有名气的卡勒姆两兄弟加入，这个狮群仍旧没有改换名号。</p>
        <p>母狮的首领是蕾拉的女儿，一位上了年纪的雌狮米兰达，论辈分，随喜要管它叫姥姥。</p>
        <p>不过狮子之间不讲究这些。</p>
        <p>米兰达是一只充满智慧和经验的狮子，旱季的时候，它会带领狮群寻找绿洲。</p>
        <p>它知道哪里有猎物，哪里危险，如何对待草原上的其它种群，如何分辨人类的好坏。</p>
        <p>有她的带领，狮群才有如今的繁荣。</p>
        <p>米兰达有不少粉丝。</p>
        <p>经常有观光车来专门拍它，两只雄狮的粉丝也很多，随喜的母亲伊娃也有一些粉丝，她的一个亚成年姐姐和哥哥同样小有名气。</p>
        <p>非洲的狮子大约都被拍习惯了，这些拍摄团队的车和游客观光车来来往往，它们一点反应都没有。</p>
        <p>随喜对人类抱有天然的好感，她当人都当了二十多年了，当小狮子才几个月而已。</p>
        <p>但她决定和拍摄团队亲近一些，倒不是因为这个。</p>
        <p>虽然拍摄纪录片的团队都倡导不干预自然法则，不过人类经常自相矛盾。</p>
        <p>随喜在的地方是自然保护区内，保护区是有救援队的，很多时候，摄影师虽然自己不会动手救受伤的狮子，但会通知救援队来。</p>
        <p>最关键的，就是人气。</p>
        <p>人气越大，关注的粉丝越多，受伤后得到救治的可能越大。</p>
        <p>纪录片也是要流量的。拍摄团队舍不得明星狮子死去，对它们的关注比普通狮子要多很多。</p>
        <p>随喜也要成为明星狮子。</p>
        <p>值夜班的人把摄像机转过来，夜色漆黑，但随喜看得清楚，人类正在拍摄自己。</p>
        <p>那她表演得更卖力些吧！</p>
        <p>随喜扭着屁股，和西尔莎一起咬空气，菜鸡互啄。</p>
        <p>夜晚的草原很安静，除了西尔莎奶奶的嗷呜声，随喜还能听见车内的话。</p>
        <p>“珀尔长得真大啊，完全看不出来才四个月。”</p>
        <p>“哈哈，它被伊娃追着喂奶的视频已经破三十万点击了，等它长大了，再看这些一定很好笑。”</p>
        <p>“其实我昨天还贡献了三次。”</p>

        <p>随喜一僵，被西尔莎咬了个正着。</p>

<template id="ch1">

  <p>多写几段多写几段多写几段多写几段多写几段多写几段多写几段多写几段多写几段多写几段多写几段多写几段多写几段多写几段多写几段多写几段多写几段多写几段多写几段多写几段多写几段多写几段多写几段多写几段多写几段多写几段多写几段多写几段多写几段多写几段多写几段多写几段。</p>

<template id="ch2">
  <p>第三章。</p>
  <p>故事到此结束。</p>
</template>


<script>
(function () {
  const $ = id => document.getElementById(id);

  // 收集所有章节模板
  const templates = Array.from(document.querySelectorAll('template[id^="ch"]'))
    .sort((a, b) => +a.id.slice(2) - +b.id.slice(2));

  const chapters = templates.map((tpl, i) => {
    const h2 = tpl.content.querySelector('h2');
    const title = h2 ? h2.textContent.trim() : `第 ${i + 1} 章`;
    return { title, templateId: tpl.id };
  });

  let current = 0;
  let shouldRestoreScroll = false; 
  let isRestoring = false; // 防止恢复滚动时触发保存覆盖

  // ===== 本地存储管理 =====
  function getReadData() {
    return JSON.parse(localStorage.getItem('novel_read_data') || '{}');
  }
  function saveReadData(data) {
    localStorage.setItem('novel_read_data', JSON.stringify(data));
  }

  // ===== 渲染目录 =====
  function renderToc() {
    const readData = getReadData();
    $('toc').innerHTML = chapters.map((c, i) => {
      let progressHtml = '';
      const record = readData[i];
      if (record) {
        const percent = Math.floor(record.percent || 0);
        if (percent >= 98) {
          progressHtml = `<span class="toc-progress done">已读完</span>`;
        } else if (percent > 0) {
          progressHtml = `<span class="toc-progress">已读 ${percent}%</span>`;
        }
      }
      return `<li data-i="${i}">
        <span>${escapeHtml(c.title)}</span>
        ${progressHtml}
      </li>`;
    }).join('');
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  // 目录点击
  $('toc').addEventListener('click', e => {
    const li = e.target.closest('li');
    if (li) {
      const i = +li.dataset.i;
      const readData = getReadData();
      // 如果已有记录，并且不是读完的，准备恢复位置
      if (readData[i] && readData[i].scroll > 0 && readData[i].percent < 98) {
        shouldRestoreScroll = true;
      } else {
        shouldRestoreScroll = false;
      }
      showChapter(i);
    }
  });

  // ===== 显示章节 =====
  function showChapter(i) {
    if (i < 0 || i >= chapters.length) return;
    current = i;

    const tpl = document.getElementById(chapters[i].templateId);
    const content = $('content');

    // 1. 渲染 DOM
    content.innerHTML = '';
    content.appendChild(tpl.content.cloneNode(true));

    $('chapterTitle').textContent = chapters[i].title;
    $('prev').disabled = current === 0;
    $('next').disabled = current === chapters.length - 1;

    $('toc').classList.add('hidden');
    $('reader').classList.remove('hidden');
    $('topBack').classList.add('show');

    // 重播动画
    content.style.animation = 'none';
    void content.offsetWidth;
    content.style.animation = '';

    localStorage.setItem('novel_last_chapter', current);
    
    // 2. 滚动处理
    if (shouldRestoreScroll) {
      const readData = getReadData();
      const targetScroll = readData[current]?.scroll || 0;
      isRestoring = true;
      
      // 延迟稍微久一点(50ms)，确保字体和排版已经渲染完毕，计算高度才准确
      setTimeout(() => {
        window.scrollTo(0, targetScroll);
        updateProgress(); // 更新顶部的线
        isRestoring = false;
      }, 50);
    } else {
      window.scrollTo(0, 0);
      setTimeout(updateProgress, 50);
    }

    shouldRestoreScroll = false;
  }

  // ===== 返回目录 =====
  function showToc() {
    if ($('reader').classList.contains('hidden')) return;

    $('reader').classList.add('hidden');
    $('toc').classList.remove('hidden');
    $('topBack').classList.remove('show');
    window.scrollTo(0, 0);
    $('progress-bar').style.width = '0%';
    
    renderToc();
  }

  // ===== 核心：更新并保存阅读进度 =====
  function updateProgress() {
    if ($('reader').classList.contains('hidden') || isRestoring) return;

    const scrollTop = window.scrollY || document.documentElement.scrollTop;
    const scrollHeight = document.documentElement.scrollHeight - window.innerHeight;

    let percent = 0;
    
    // 修复 Bug：如果内容不够长，scrollHeight 会是负数或 0
    if (scrollHeight <= 0) {
      // 如果屏幕还没显示完一章，默认算作 100% 已读完
      percent = 100; 
    } else {
      percent = (scrollTop / scrollHeight) * 100;
    }
    
    // 防止越界
    percent = Math.min(100, Math.max(0, percent));

    // 更新顶部进度线
    $('progress-bar').style.width = percent + '%';

    // 保存进度
    const readData = getReadData();
    const oldRecord = readData[current] || { percent: 0, scroll: 0 };
    
    // 如果比原来读得多，或者快到底了，就保存
    if (scrollTop > oldRecord.scroll || percent > 98) {
      readData[current] = {
        percent: percent,
        scroll: scrollTop
      };
      saveReadData(readData);
    }
  }

  // 监听滚动
  window.addEventListener('scroll', () => {
    window.requestAnimationFrame(updateProgress);
  });

  // ===== 清空记录 =====
  $('btnClear').addEventListener('click', () => {
    if (confirm('确定要清空所有阅读进度吗？清空后不可恢复。')) {
      localStorage.removeItem('novel_read_data');
      localStorage.removeItem('novel_last_chapter');
      renderToc();
      $('progress-bar').style.width = '0%';
    }
  });

  // ===== 按键 / 点击绑定 =====
  // 如果是通过翻页按钮进入，强制从顶部开始看
  $('prev').addEventListener('click', () => { shouldRestoreScroll = false; showChapter(current - 1); });
  $('next').addEventListener('click', () => { shouldRestoreScroll = false; showChapter(current + 1); });
  $('back').addEventListener('click', showToc);
  $('topBack').addEventListener('click', showToc);

  // 键盘翻页
  document.addEventListener('keydown', e => {
    if ($('reader').classList.contains('hidden')) return;
    if (e.key === 'ArrowLeft')  { shouldRestoreScroll = false; showChapter(current - 1); }
    if (e.key === 'ArrowRight') { shouldRestoreScroll = false; showChapter(current + 1); }
    if (e.key === 'Escape')     showToc();
  });

  // ===== 解决手机/浏览器返回键问题 =====
  window.addEventListener('popstate', (e) => {
    if (!$('reader').classList.contains('hidden')) {
      showToc();
    }
  });

  const originalShowChapter = showChapter;
  showChapter = function(i) {
    if (i < 0 || i >= chapters.length) return;
    if ($('reader').classList.contains('hidden')) {
      history.pushState({ page: 'reader' }, '', '#chapter-' + i);
    } else {
      history.replaceState({ page: 'reader' }, '', '#chapter-' + i);
    }
    originalShowChapter(i);
  };

  // ===== 字号调节 =====
  let fontSize = 18;
  function applyFontSize() {
    document.body.style.fontSize = fontSize + 'px';
    localStorage.setItem('novel_fontSize', fontSize);
    if (!$('reader').classList.contains('hidden')) {
      setTimeout(updateProgress, 100);
    }
  }
  $('btnFontUp').addEventListener('click', () => {
    fontSize = Math.min(28, fontSize + 2); applyFontSize();
  });
  $('btnFontDown').addEventListener('click', () => {
    fontSize = Math.max(14, fontSize - 2); applyFontSize();
  });

  // ===== 夜间模式 =====
  function applyNight(on) {
    document.body.classList.toggle('night', on);
    localStorage.setItem('novel_night', on ? '1' : '0');
  }
  $('btnNight').addEventListener('click', () => {
    applyNight(!document.body.classList.contains('night'));
  });

  // ===== 初始化 =====
  renderToc();

  if (localStorage.getItem('novel_night') === '1') applyNight(true);
  const savedFont = localStorage.getItem('novel_fontSize');
  if (savedFont) { fontSize = +savedFont; applyFontSize(); }

  // 自动续读
  // const savedChapter = localStorage.getItem('novel_last_chapter');
  // if (savedChapter !== null && +savedChapter < chapters.length) {
  //   shouldRestoreScroll = true; 
  //   showChapter(+savedChapter);
  // }
})();
</script>
