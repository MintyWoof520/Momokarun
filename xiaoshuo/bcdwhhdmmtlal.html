        <h2>第1章 草原狮子嗷嗷嗷</h2>
        <p>加班果然不是人该干的。</p>
        <p>随喜有些郁闷地把头埋进干草堆里，满怀忧郁地叹了口气。</p>
        <p>她本来是观光团临时雇佣的翻译，一场意外，再醒来时，就成了非洲大草原上一只还没断奶的小狮子。</p>
        <p>从吃饱穿暖有工作也有存款的人，变成了每天都要为生存努力奋斗的野生动物，倒霉不是一般程度上的那种。</p>
        <p>是超级无敌倒霉透顶。</p>
        <p>好在她向来看得开，变成狮子，日子也得照样过嘛。</p>
        <p>让随喜心态还算乐观的主要原因，就是她现在所处的狮群实力还不错。</p>
        <p>是个有着二十只狮子的大狮群。</p>
        <p>地主雄狮是一对兄弟，关系特别腻歪，感情很好，而且长得也很帅，拥有一头浓密的黑色鬃毛，简直帅呆了。</p>
        <p>七只雌狮也表示了对这头浓密鬃毛的欣赏，经常贴贴。随喜还有两个亚成年姐姐，一个哥哥，和八个差不多月份的姐妹兄弟。</p>
        <p>随喜记得自己之前看过一个视频，说动物园有一只雄狮特别能打，打败了其它的雄狮，却没有一只雌狮看得上它，连对视都没有，来回躲避目光。</p>
        <p>就是因为这头狮子是个秃头，鬃毛稀疏，雌狮们都瞧不上。</p>
        <p>它们喜欢盘靓条顺的帅哥，不喜欢杀马特。</p>
        <p>雄狮的鬃毛真的很好看，大围脖很有气势。不过随喜对自己投生转世仍旧是雌性这件事还是挺高兴的，她一个外行都知道雄狮是狮群的消耗品。</p>
        <p>铁打的雌狮流水的雄狮。</p>
        <p>雌狮才是这片领地的真正拥有者。</p>
        <p>长得帅不如实力强，这才是活下去的关键。</p>
        <p>不过狮群迭代这些事用不着她操心。</p>
        <p>随喜刚四个月，还是一只无忧无虑的小狮子，每天要做的事情只有吃奶和玩耍。</p>
        <p>玩耍也是狮子们建立感情、练习捕猎的过程。</p>
        <p>所以她去找别的小狮子玩是没错的，绝对不是穿越以后心智也变小了。</p>
        <p>随喜伸了个懒腰，蹑手蹑脚跑到另一头小狮子身后，趁它不注意直接扑了上去。</p>
        <p>哈哈！偷袭！</p>
        <p>本来正睡觉的小狮子被吓了一跳，嗷呜一声，睁大圆溜溜的眼睛，里面满是惊吓。</p>
        <p>它的眼睛和其它狮子不同，不是黄色，有一只是金绿色，是狮子里非常罕见的异瞳。</p>
        <p>有奶膘的小狮子身边到处都是，异瞳的可就只有一个，多么稀罕。</p>
        <p>随喜欢乐地吸着小狮子，对着它的爪子虚虚咬上一口。</p>
        <p>别睡了，快起来玩！</p>
        <p>她嗷嗷叫着跑开。</p>
        <p>惊吓过后就是亲密，幼狮翻过身，紧追着她，其它玩耍的小狮子见到追逐活动，也忍不住加入。</p>
        <p>四只圆滚滚的幼狮跑成一条线，你扑我，我扑你，奶声奶气，看得人心都化了。</p>
        <p>不远处坐在车里举着望远镜和摄像头的人们不约而同发出了“awwww……”的声音。</p>
        <p>“这一窝小狮子真是健壮，看样子成长率或许能比上一窝更高。上一窝七个才活下来三只。”</p>
        <p>“安塞尔和卡勒姆是一对非常靠谱的爸爸，经常和母狮们一起捕猎，这才能把幼崽们都养好。”</p>
        <p>“哈哈哈是啊，这一大家子都很会做饭。”</p>
        <p>“快瞧，珀尔又把别的幼狮丢到一边，只和西尔莎一起玩，它真可爱，不是吗？”</p>
        <p>“谁会不喜欢西尔莎呢，它的眼睛独一无二，实在是很漂亮。”</p>
        <p>远处忽然传来阵阵狮吼声，一位摄影师忍不住站起来，向远处看，同时，她的对讲机发出声音。</p>
        <p>是跟着狮群捕猎队伍的同伴传来消息。</p>
        <p>留守的几人对视一眼，“看来今天狮群又能吃个饱饭了。”</p>
        <p>随喜听到狮群呼唤的声音，看守幼狮的两只成年雌狮和两只亚成年站起来，朝着声音发出的方向赶过去。</p>
        <p>幼崽们也跑着跟上。</p>
        <p>随喜已经闻到了空气中的血腥气。</p>
        <p>走近一看，原来是一只野牛！</p>
        <p>这可是个大家伙，看起来有七八百千克，身上覆盖着黑色的短毛，两根粗壮锋利的牛角比她都长。</p>
        <p>此时它身上已经长满了狮子。</p>
        <p>有着黄色皮毛的大狮子们满头满脸都是血，望过来的眼神满是冰冷肃杀，充满了捕食者的野性。</p>
        <p>不同于其它狮群的是，首先进食的并不是雄狮，而是几只需要哺乳的雌狮。</p>
        <p>雄狮卡勒姆正喘着粗气，趴在一边，完全没有驱赶的意思，它也是参与捕猎的一员，竟然把进食的位置让了出去。</p>
        <p>它是累了需要休息吗？</p>
        <p>随喜不是第一次看到这种场面，她可以明确地说，这只雄狮就是一个“奇葩”，是雄狮中的异类。</p>
        <p>它是有意让出进食的位置，给雌狮先吃的。</p>
        <p>相隔大约只有三十来米的地方，两辆车上的拍摄者发出惊叹，这副画面不论看几次都会让人震惊，对这只雄狮的温柔谦让感到不可思议。</p>
        <p>要知道别的雄狮总是把进食的雌狮赶走，让它们吃剩饭的。雄狮要保证自己的健康和地位，会驱赶幼狮，驱赶雌狮，独占猎物。</p>
        <p>而在蕾拉狮群，自从卡勒姆和安塞尔这对兄弟加盟，就再也没发生过这种事。</p>
        <p>卡勒姆是一只温柔的大狮子，总是让幼崽和哺乳雌狮先吃。</p>
        <p>等需要哺乳的雌狮吃饱了退下来，雄狮卡勒姆才和赶过来的兄弟，以及其它雌狮一同吃第二波。</p>
        <p>血腥味随风飘远，引来秃鹫和鬣狗，可它们只敢在远处观望，不敢靠近。</p>
        <p>鬣狗的叫声像鬼哭鬼笑，嘶哑又尖利，它们是杀害幼狮的主力军。</p>
        <p>可随喜不怕，这群鬣狗疯了才会过来抢这么多狮子的猎物。</p>
        <p>果然没多久，它们就离开了，只有秃鹫还盘旋着，在远处落下，等待一份白得的餐食。</p>
        <p>随喜皱皱鼻子，她能感受到血腥气的吸引力。</p>
        <p>穿成狮子，食谱变化，生肉在她这里也变成了美妙大餐，只不过她还没到吃肉的岁数，牙没长好，只能吃奶。</p>
        <p>一只脸上沾满血迹的雌狮慢悠悠走过来，舔着嘴巴，走到她身边，低下头对她进行了一番温柔的舔毛梳理。</p>
        <p>随喜被舔得晃来晃去，最后一屁股坐到地上，连肚皮也被翻了过来。</p>
        <p>刚刚她还吸别的小狮子，现在就成了被吸的一员。</p>
        <p>风水轮流转。</p>
        <p>随喜嗷呜一声，一点反抗的意思都没有。</p>
        <p>没别的原因。</p>
        <p>这是她这辈子的亲妈。</p>
        <p>被亲妈舔毛那叫照顾，必然不能躲啊。</p>
        <p>随喜听到拍摄的人叫它伊娃。</p>
        <p>这个名字是母亲的意思。</p>
        <p>伊娃是一只长得非常标志的雌狮，宽宽的鼻梁，两只耳朵微微向内卷着，有很多豁口在上面。</p>
        <p>它的鼻梁上有一道伤疤，身上也有，这些伤疤让它看起来更加威严，证明了它的阅历丰富。</p>
        <p>随喜是伊娃的第三胎，独生子，没有姐妹兄弟，获得了全部的爱。</p>
        <p>伊娃对她很是关注，总给她舔毛，甚至还会叼她回来吃奶。</p>
        <p>这在别的雌狮身上也是很不常见的举动，不过……这倒不是伊娃的个性，要怪随喜自己。</p>
        <p>随喜刚穿过来的时候，对吃奶这件事还是蛮有心理压力的，有点抗拒。</p>
        <p>她下不去口。</p>
        <p>到了该吃奶的时候，她没吃。可能就是这样，导致伊娃对她吃奶这件事格外上心。</p>
        <p>别的小狮子是要自己追着妈妈要奶吃，到她这儿反了过来，是妈追着娃喂奶。</p>
        <p>伊娃奶水充足，就算偶尔要喂一喂姐妹的孩子，剩下的奶也份量十足，根本不是随喜吃得完的。</p>
        <p>偏偏喂得次数多，她撑得不行，只好多动动，试图快点消化。运动多了，饿得就快。</p>
        <p>不曾想她吃得越多，伊娃喂得越频繁。</p>
        <p>也许在它看来，幼崽能吃是一件好事，证明它健康、健壮。</p>
        <p>温柔的洗脸过后，伊娃果然躺下，露出肚皮，低低叫了一声。</p>
        <p>她金棕色的眼睛注视着随喜，明明狮子脸上没有表情，随喜却感到了一种压力。</p>
        <p>亲妈is watching you。</p>
        <p>还能怎么办，吃吧。</p>
        <p>正好她也饿了。</p>
        <p>整个狮群都享用了一顿美餐，它们并没有离开，而是在野牛尸体旁边驻扎下来。</p>
        <p>这具野牛还没吃完，足够狮群再吃一顿的。</p>
        <p>黄色的大猫横七竖八躺着，懒洋洋打盹，就连最调皮的幼崽也打着哈欠，被困意骚扰。</p>
        <p>随喜倒在母亲怀里，美滋滋睡觉。</p>
        <p>这可不能说她懒惰，狮子就是这样，吃饱了当然要睡觉。</p>
        <p>这一觉就睡到了半夜，有狮子去啃牛骨头，咬得嘎吱嘎吱响。</p>
        <p>随喜睡饱了，精力旺盛，和同样醒着的西尔莎对上眼。</p>
        <p>是邀请我一起玩的意思吗？</p>
        <p>她甩甩尾巴。</p>
        <p>异瞳幼狮原地打了个滚。</p>
        <p>噢噢噢！你也喜欢和我一起玩吧？</p>
        <p>随喜欢乐地跑过去，和西尔莎抱在一起，在草地上打了好几个滚。</p>
        <p>对于幼狮来说，草原上的一切都充满了诱惑。</p>
        <p>狮子的尾巴是天然的逗猫棒，末端坠着的黑色小球在幼狮眼里，是再完美不过的玩具。</p>
        <p>随喜也抵抗不了这种诱惑。</p>
        <p>会动的毛球实在是太好玩了，她的身体在催促她快扑过去。</p>
        <p>随喜扭着屁股潜行了两步，跳着咬住一边，西尔莎咬住另一边，四脚朝天，使出猫科绝学——后腿乱蹬。</p>
        <p>被两只幼狮骚扰的成年雌狮眼睛都不睁开一下，只是习以为常把尾巴抽出来，甩一甩。</p>
        <p>没了尾巴，草丛里的小虫子也很有趣。</p>
        <p>西尔莎叼着一只甲壳虫，肥墩墩地坐到随喜跟前，和她分享这个玩具。</p>
        <p>西尔莎是一只圆滚滚的肥美小狮子。</p>
        <p>比随喜大一个月，不过随喜吃得太好，营养充足，体型上倒是和它差不多。</p>
        <p>这不是随喜开天眼，而是听到拍摄团队聊天知道的信息。</p>
        <p>这个拍摄团队已经跟踪拍摄狮群七八年了，一直在记录着狮群一代代的故事。</p>
        <p>她所在的狮群叫蕾拉狮群，是由上一代传奇母狮蕾拉命名，哪怕有了很有名气的卡勒姆两兄弟加入，这个狮群仍旧没有改换名号。</p>
        <p>母狮的首领是蕾拉的女儿，一位上了年纪的雌狮米兰达，论辈分，随喜要管它叫姥姥。</p>
        <p>不过狮子之间不讲究这些。</p>
        <p>米兰达是一只充满智慧和经验的狮子，旱季的时候，它会带领狮群寻找绿洲。</p>
        <p>它知道哪里有猎物，哪里危险，如何对待草原上的其它种群，如何分辨人类的好坏。</p>
        <p>有她的带领，狮群才有如今的繁荣。</p>
        <p>米兰达有不少粉丝。</p>
        <p>经常有观光车来专门拍它，两只雄狮的粉丝也很多，随喜的母亲伊娃也有一些粉丝，她的一个亚成年姐姐和哥哥同样小有名气。</p>
        <p>非洲的狮子大约都被拍习惯了，这些拍摄团队的车和游客观光车来来往往，它们一点反应都没有。</p>
        <p>随喜对人类抱有天然的好感，她当人都当了二十多年了，当小狮子才几个月而已。</p>
        <p>但她决定和拍摄团队亲近一些，倒不是因为这个。</p>
        <p>虽然拍摄纪录片的团队都倡导不干预自然法则，不过人类经常自相矛盾。</p>
        <p>随喜在的地方是自然保护区内，保护区是有救援队的，很多时候，摄影师虽然自己不会动手救受伤的狮子，但会通知救援队来。</p>
        <p>最关键的，就是人气。</p>
        <p>人气越大，关注的粉丝越多，受伤后得到救治的可能越大。</p>
        <p>纪录片也是要流量的。拍摄团队舍不得明星狮子死去，对它们的关注比普通狮子要多很多。</p>
        <p>随喜也要成为明星狮子。</p>
        <p>值夜班的人把摄像机转过来，夜色漆黑，但随喜看得清楚，人类正在拍摄自己。</p>
        <p>那她表演得更卖力些吧！</p>
        <p>随喜扭着屁股，和西尔莎一起咬空气，菜鸡互啄。</p>
        <p>夜晚的草原很安静，除了西尔莎奶奶的嗷呜声，随喜还能听见车内的话。</p>
        <p>“珀尔长得真大啊，完全看不出来才四个月。”</p>
        <p>“哈哈，它被伊娃追着喂奶的视频已经破三十万点击了，等它长大了，再看这些一定很好笑。”</p>
        <p>“其实我昨天还贡献了三次。”</p>
        <p>“不瞒你说，我也。”</p>
        <p>随喜一僵，被西尔莎咬了个正着。</p>
        <p>等等，你说她的黑历史多少点击了？</p>

    <template id="ch1">
        <h2>第2章 草原狮子嗷嗷嗷</h2>
        <p>随喜有点郁闷，她绝对不承认是因为知道自己的黑历史广为流传了。</p>
        <p>被母狮追着喂奶，怎么算不上光辉。</p>
        <p>往好处想，她现在也算有点名气了不是？</p>
        <p>虽然这跟她想象的出名场景完全不搭。</p>
        <p>她设想的：单杀角马、独猎斑马，嚼鳄鱼辣条。</p>
        <p>实际上的：妈宝狮。</p>

        <p>救助站附近其实经常有动物来，这些小动物也知道里面的人类很友好，尤其是一些小鸟，蹭吃蹭喝，在水盆里洗澡。</p>
        <p>哪怕旱季也不会缺水。</p>
        <p>还有一些蜜獾啊，食蚁兽啊，小狐狸什么的，不过随喜卧在这里后，这些小动物就绕道了。</p>
        <p>随喜：没办法，就是这样有威慑力。</p>
        <p>她已经过了没成年时喜欢手欠的时候，现在不去骚扰小动物了，不过却没有谁真的敢靠近食物链顶端的捕食者，哪怕是老鼠。</p>
        <p>救助站内，西尔莎的状态却不太好。</p>
        <p>麻醉效果结束后，它看到自己来到一个陌生的环境，被关在非常狭小的空间，立刻就应激了。</p>
        <p>被咬伤的腿传来剧痛，西尔莎不太明白发生了什么，它不敢用这条腿着地，还很虚弱。</p>
        <p>空气中充满了混杂的气味，各种动物的，医疗试剂的，消毒水，人味。</p>
        <p>房间里也还残留着上一位住客的气息，一只豹子。</p>
        <p>尽管被打扫过，可西尔莎嗅得出来。</p>
        <p>它很不喜欢。</p>
        <p>不喜欢这样混乱的气味，不喜欢狭小的空间。</p>
        <p>它的月亮星星，也不在附近。</p>
        <p>西尔莎焦躁地在笼子里转了两圈，它卧下来，开始等待。</p>
        <p>到了第二天，伤口该换药了。</p>
        <p>兽医波利和同事们早早就起了，他们来到观察室，隔着笼子看西尔莎的伤口。</p>
        <p>“没有恶化。”同事说，“精神也还不错。”</p>
        <p>为了看仔细，他走得近了一些。</p>
        <p>波利医生却觉得心里毛毛的，一种危机预感，一种直觉提醒，让他始终提着心脏，不能放松。</p>
        <p>要知道他面对珀尔的时候，可基本从来没紧张过。</p>
        <p>同事转过身，假寐的狮子张开眼。</p>
        <p>“不！快躲！”</p>
        <p>毛骨悚然的预感径直击中了波利医生，他以从未有过的速度拽住同事胳膊向后一拉。</p>
        <p>咚！</p>
        <p>他俩一起倒在地上。</p>
        <p>咣当！</p>
        <p>狮子猛地撞上铁门，爪子伸出栏杆，锋利尖锐的指甲挠着空气。</p>
        <p>只差一点！它就要抓上了。</p>
        <p>“噢我的天！天呐！怎么会，天呐……谢谢，谢谢！”同事惊魂未定，脸色唰一下就白了。</p>
        <p>兽医波利也是额头虚汗直冒，“我就觉得有些不对劲，没想到……”</p>
        <p>他也是吓得半死，魂都要飞出去了。</p>
        <p>听到动静的其他人跑过来，赶紧把他俩扶起来，搀离这里。</p>
        <p>笼子内，西尔莎徘徊了一阵，眼神凶狠。</p>
        <p>“怎么会攻击……”同事拍着胸口，百思不得其解，“茱莉亚之前帮它处理伤口的时候，西尔莎还没失去意识，它都没攻击，为什么？”</p>
        <p>他哀嚎，“难道西尔莎讨厌我吗？”</p>
        <p>“还要你把我救了，不然我估计要少块肉了。”</p>
        <p>波利医生摇摇头，“也是我们太不小心了，不应该离笼子那么近的。”</p>
        <p>他们都被之前的事情迷惑了，并不是所有的狮子都亲近人类。</p>
        <p>之前茱莉亚能好好的，或许也只是因为珀尔在旁边，她也说了，全程珀尔都压在了西尔莎身上，不让它动。</p>
        <p>能接触的从来都只有珀尔一头狮子。</p>
        <p>西尔莎太野了。</p>
        <p>等等，珀尔……</p>
        <p>波利医生双眼放光，有了一个想法。</p>
        <p>“不行！”管理员阿曼达狠狠皱眉，“你听听自己在说什么，让珀尔来管住西尔莎，好让你们打针。这是一个受过教育、了解野生动物的兽医能说出来的话吗？那是狮子！不是家猫！”</p>
        <p>波利争辩道：“珀尔很信任人类，它也知道我们是在治疗，它有这个智慧。茱莉亚的事情就可以证明，它清楚人类在做什么，也清楚自己应该做什么。”</p>
        <p>办公室的其他人目光呆滞，像是在听天方夜谭。</p>
        <p>有个人举起手，“波利，我也承认珀尔很聪明，但是你不觉得你的想法风险太大了吗？珀尔再如何聪明，也是一头狮子，它能理解什么叫吊水注射吗……我觉得你的想法太冒险了。”</p>
        <p>让一头狮子管理另一头狮子，不打麻醉就去换药扎针……简直是说疯话。</p>

        <p>这也是一个大问题。</p>
        <p>谁都不想伤害西尔莎，这样一只健壮美丽的狮子，哪怕一丁点的医疗损伤，人们也不愿意接受。</p>
        <p>可是比起人命，孰轻孰重，每个人的心里都有一杆秤。</p>
        <p>波利深吸一口气，“让我试一试吧？不行的话就还是麻醉，但是让珀尔也进来，起码能安抚到西尔莎，让它不用一直应激乱动，对伤口造成二次伤害。”</p>

        <p>大家一起看向阿曼达，后者思索半晌，“……我同意将珀尔带进来，和西尔莎关在一起，别的到时候再说。”</p>
        <p>“太好了！”波利医生欢呼道。</p>
        <p>“别高兴得太早，要是不能成，必须上麻醉，斯格尔，把麻醉枪备好了，你们也别闲着，将走廊的门都关严锁上，伯特，去准备一份食物，从小门送进笼子里……”阿曼达发号施令，给每个人都安排了任务。</p>
        <p>波利医生也不例外。</p>
        <p>……</p>
        <p>随喜正在救助站外面研究这里的具体构造。</p>
        <p>她也是好久没见过人类建筑了，还真有点怀念，既然西尔莎已经好转，那就没什么要担心的了，随喜相信救助站的实力。</p>
        <p>嗯，这边貌似是宿舍，透过窗户能看到床，还有桌子。这里貌似是食堂啊。</p>

        <p>有一些窗口，还有一柜子的零食，啊！咖啡机，咖啡的香气，她已经闻到了。</p>
        <p>好多食物，油炸的，清水煮的，调料后的鸡排牛排，好多啤酒，竟然还有冰淇淋机。</p>
        <p>这绝对是开小灶了，三种口味冰淇淋，也太幸福了吧……好想吃。</p>
        <p>那一柜子是罐头吗？水果罐头，肉罐头鱼罐头，豆子罐头……噫，豆子就不要了，她不喜欢豆子，给英国人买的吧。</p>
        <p>好馋啊，真的好馋。</p>
        <p>随喜咽了下口水，目光里的渴望几乎要凝成实质了。</p>
        <p>不知道凭她和波利医生的交情，能不能来一份冰淇淋尝尝。</p>
        <p>别的她也不奢望了，不可能的。</p>
        <p>这群人再如何喜欢狮子，也不会拿人吃的各种调味品腌制过的食物喂。</p>
        <p>遗憾啊！</p>
        <p>本来当惯了狮子，每天只吃生肉不觉得有什么，现在闻到了食堂丰富的美味佳肴，大脑里关于美食的记忆被激活了。</p>
        <p>随喜舔舔嘴巴，此时此刻，她好想吃包辣条。</p>
        <p>她好怀念垃圾食品们。</p>
        <p>忽然，随喜听到了有人在叫她的名字。</p>
        <p>她跑过去，看到波利医生还有管理员阿曼达一起站在门口，前者眼神里隐含激动，后者则是相反的冷静与警惕。</p>
        <p>这是什么阵仗？</p>
        <p>波利医生做了次深呼吸，“好的，好的，珀尔……我可以相信你吗？”</p>

        <p>波利医生放慢语速道：“是这样的，西尔莎对于治疗流程不太配合，我又不想给它注射太多麻醉剂，你能来安抚住它吗？你可以吗？珀尔，就像是茱莉亚说过的那样。”</p>
        <p>他弯下腰，很诚恳。</p>
        <p>如果不是在和狮子对话，或许这场面会更加可信。</p>
        <p>真是大胆啊。</p>
        <p>随喜惊异极了，难道他不知道自己面对的是一头狮子吗？救助站的人也不拦着一点吗？</p>
        <p>这些人也太疯了吧……</p>
        <p>不过，算他们运气好，她是一只能听懂人话的狮子。</p>
        <p>随喜腹诽着走入敞开的大门中，她的动作很慢，既是看到了窗口处瞄准的麻醉枪口，也是为了安抚众人，展现无害。</p>
        <p>不过她真的要说，这帮人疯掉了，绝对的。</p>
        <p>正常人谁能干出来这种事，和狮子打商量……</p>
        <p>管理员阿曼达低着头，看着狮子缓慢蹭过她的大腿，又去蹭了下波利。</p>
        <p>这头大狮子瞧着很从容，它伸了个懒腰，尾巴不紧不慢地摆动，状态很闲适。</p>
        <p>走廊一路的门都是关着的。</p>
        <p>它显然也有些好奇，每走两步就要抬起头左右瞧瞧，不过并没有做出扒门的举动。</p>
        <p>关着西尔莎的地方在救助站深处。</p>
        <p>此时走廊空无一人，大家都挤在监控室，目不转睛地盯着屏幕。</p>
        <p>最开始设想是让珀尔自己走进来，一个人也不留，但波利医生强烈要求当引路人。</p>
        <p>如果实验成功，他也要去打针，怎么都得接触，还不如现在就现身，让珀尔习惯，降低警惕。</p>
        <p>管理员阿曼达不允许他独自面对狮子，她腰间别着麻醉枪，和波利站到了一起。</p>
        <p>幸运的是，一切都很顺利。</p>
        <p>珀尔在走廊里前行，仿佛这就是它的领地，那么坦然。</p>
        <p>它不紧张，也没有攻击倾向，似乎还看出来人类在忐忑，走着走着停下来，又去蹭了蹭他们。</p>
        <p>平缓的呼噜声被摄像机收音，在监控室内回荡。</p>
        <p>“……我都有点羡慕他们两个了。”</p>
        <p>“我也。”</p>
        <p>终于，他们来到了目的地。</p>
        <p>走廊的尽头，就是关着西尔莎的房间。</p>
        <p>为了防止意外，这里是有两个隔断门的。</p>
        <p>西尔莎注意到了珀尔，它顿时激动起来，隔着门嚎叫，吼声悠长，一瘸一拐地在门口打转。</p>
        <p>珀尔嗷呜一声，声音盖过了西尔莎的叫声，阿曼达感觉自己的耳朵嗡了一下。</p>
        <p>太响了。</p>

        <p>刚刚还凶狠的狮子变成委屈巴巴的大猫，只从喉咙里挤出低低的呜呜声。</p>

        <p>随喜看出来这里有隐藏的栅栏门，人停留在门外面，她自己走进去。</p>

        <p>看到门开，西尔莎作势就要起身，被随喜一嗓子叫住。</p>
        <p>受伤了就不要乱动好不好，一点也不省心。</p>
        <p>随喜嘴上吐槽，动作却不慢，小跑着靠近，来到西尔莎身边，栅栏门再次落下，她没有动。</p>
        <p>也不对，她动了，不过不是从笼子里出去，而是低下头，舔了舔西尔莎的耳朵。</p>
        <p>来陪你啦，大笨蛋。</p>
        <p>西尔莎瞧着是那么高兴，不让站起来，那就翻滚。</p>
        <p>它翻过肚皮，仰着脸望着它的月亮，短促地叫了几声。</p>
        <p>或许这个环境还是那么陌生，气味还是那么讨厌，但西尔莎已经不在乎了，只要它的月亮还在身边，那它就很安心。</p>
        <p>随喜趴下来，轻轻舔着对方的脸。</p>
        <p>她能看出来，西尔莎还有些害怕，不过她来了以后，它就不怕了。</p>
        <p>温情脉脉的舔毛行为持续了好一阵，随喜才看向西尔莎的伤口，它的后腿已经肿了，还挺明显的，被纱布缠着都能瞧出来大了一圈。</p>
        <p>上面还有药味儿。</p>

        <p>生病受伤就要吃药，不吃药怎么可能痊愈，这条腿还想不想要了，以后还要不要一起抓水牛了，赶紧吃药，不许假装听不懂，也不许假装看不到！</p>
        <p>西尔莎被她吼得飞机耳都出来了，一双眼睛可怜巴巴地瞄了她一眼，又看回食盆。</p>
        <p>随喜：吃！</p>
        <p>西尔莎艰难低头，不情不愿地张嘴叼起一块肉。</p>

        <p>西尔莎囫囵吃光所有的肉，慢吞吞舔着盆底，假装自己很听话，却用余光偷偷瞥随喜。</p>
        <p>瞧着副样子，不知道还以为她欺负它了。</p>

        <p>……</p>
        <p>人们观察着西尔莎的状态，估量着现在应该还不错，波利就带上药箱，站到了栅栏门前。</p>
        <p>西尔莎的耳朵动了动，从喉咙里发出警告的低吼。</p>

        <p>病人对大夫大呼小叫，这是医闹，笨蛋文盲狮子懂不懂啊，把医生吓跑了谁给你治病疗伤。</p>
        <p>随喜三两下就把西尔莎压得扁扁的，类似一个叠罗汉的姿势，然后她给了波利医生一个眼神。</p>

        <p>何况治疗野生动物怎么会没有风险呢，救助站的每个人身上都有不少疤痕，所有人都受过伤。</p>
        <p>他有面对一切的心理准备。</p>

        <p>要知道她们之前巡视领地，都是半天起步的。</p>
        <p>而且这里也没有其它的动物，看不到角马斑马们，也听不到吵闹的狒狒叫、鬣狗叫。</p>

        <p>人们是为了她们的健康，为了更久地延长她们的寿命，是处于好心，才把她们从野外转移到保护园区内。</p>
        <p>比起风餐露宿、意外频发的野外，自然园区内的环境更加安稳。</p>

        <p>随喜只能多陪伴西尔莎，把园区准备的皮球推过来，邀请西尔莎一起玩。</p>

        <p>在园区的日子非常清闲，随喜也见到了好多她的粉丝们，曾经包机票的那位富豪姐姐经常过来，还认领了她们两个，动不动就空运一些美味食材。</p>

        <p>一个大雪纷飞的天气，并不适合出行，然而一群人却顶着风雪，在山林间艰难前行。</p>
        <p>每走一步，他们的腿都会深深陷进雪里，大雪直接没过膝盖，让行走变得尤为困难。</p>
        <p>这队人一直都没有说话，不知道跋涉了多远，打头的人忽然弯下腰，盯着一根松树干看个不停。</p>
        <p>片刻后，她难掩激动道：“你们瞧，这撮毛是不是？”</p>
        <p>每说一个字，从她嘴里呼出的热气都像是老式蒸汽火车的烟囱，呼啦啦冒着白烟。</p>
        <p>余下的四个人围成一圈，挨个观察过这根平平无奇的扑通松树，其中一位小心翼翼地想要摘下挂在树干上的一缕金色短毛，怎奈手套太厚，手指头太过笨重。</p>
        <p>他索性摘下手套，徒手把这撮毛捏起来，凑在眼睛前面看。</p>
        <p>“没错，没错！”他兴奋极了，“是这个没错！”</p>
        <p>“老童，快把手套戴上！”</p>
        <p>短短片刻，他的手就被吹得通红，皮肤似乎要裂开。</p>
        <p>领队的李教授鼓劲道：“我们距离找到目标更近了，大家坚持住，吃点巧克力补充一下热量。”</p>
        <p>几个人也不多说，熟练地围成一个半圈，背对着风，快速掏出巧克力棒塞进嘴里，囫囵个咽下。</p>
        <p>他们冒着风雪也要来到森林之中，是有原因的。</p>
        <p>这是一队专门致力于东北虎种群保护的专家，由中俄两国联合组成，就是为了探寻野外东北虎的踪迹。</p>
        <p>现在的东北虎，已经濒临灭绝了。</p>
        <p>1998年，中俄美三国联合在东北地区展开搜寻，可结果却发现国境内已经没有一只可繁育母虎，东北虎处境堪忧。</p>
        <p>可天无绝人之路，一只雌虎十月，从俄罗斯跨越边境线来到华国境内，瞬间为这片土地注入了新的生机。</p>
        <p>二十多年过去，东北虎的种群数量增长扩散，大家已经可以很欣慰地说，野生东北虎种群已然初步稳定。</p>
        <p>因为东北虎食量很大，平均每周都要进食一次，一年要吃五六十多头马鹿或者野猪，而能维持这样数量的供给，需要保证领地内有不少于五百只的大型食草动物种群。</p>
        <p>只有环境得到恢复，东北虎才有存活下去的可能。</p>
        <p>可就在一切都变好的时候，因为人类活动的破坏，加上科技发展对环境的危害，到了二十一世纪末，东北虎的数量大幅削减，野外有记录的东北虎甚至不到十只。</p>
        <p>不是单华国境内，而是全世界范围内不到十只。</p>
        <p>动物园内是有东北虎的，可是这些老虎经过长时间的人工喂养，已经不适合野外生活。</p>
        <p>人们的野化活动也未见成效。</p>
        <p>所有人都很痛苦，难道东北虎真的要在野外销声匿迹了吗？</p>
        <p>对环境的治理需要时间，东北虎能坚持到那个时候吗？</p>
        <p>就在大家都感到绝望时，固定在树上的红外摄像机忽然捕捉到了一个身影。</p>
        <p>金棕色的皮毛上覆盖着黑色的条纹，是东北虎！</p>
        <p>可画面里，这只东北虎的状态非常差，它走路时踮着脚一瘸一拐，几乎瘦成了皮包骨，仿佛一场风就能将它吹倒，再也起不来。</p>
        <p>它现在很危险！急需救治！</p>
        <p>不能让东北虎的数量再减少一只了。</p>

        <p>皇天不负有心人，在长达两个多小时的艰难跋涉后，他们终于找到了东北虎的脚印。</p>
        <p>北风呼啸扬起雪花，仿佛自然界的橡皮擦，在时间这双手的操纵下，擦除着一切痕迹。</p>
        <p>他们的速度必须要快，赶在风雪掩埋足迹之前找到那只老虎。</p>
        <p>这样残酷的天气……它存活的可能性太低了。</p>
        <p>一行人振奋精神，在领队李教授的带领下继续朝着森林深处进发。</p>
        <p>又过了不知道多久，队伍里的一位年轻人压低声音道：“看前面，那棵榆树下面是尾巴吗？”</p>
        <p>她指着西北方向的一棵大榆树，在脸盆粗的树干后面，有一抹若隐若现的棕黄。</p>

        <p>“是！我们找到它了！”</p>

        <p>这个距离，以老虎的听觉水平，早就发现他们了。</p>

        <p>可随着他们绕到视野开阔的地方，这些人立刻就明白为什么老虎会呆在这里让他们发现。</p>

        <p>冬日的阳光那么单薄。</p>
        <p>有那么一瞬间，李教授的眼睛被扬起的雪花闪了一下，望远镜照出的画面里，老虎的胸膛猛地颤动，像是长叹了口气。</p>
        <p>似乎山林也看不下去，为它注入了新的生命力。</p>
        <p>“还活着！”李教授喊道，“还活着，快打电话叫直升机！”</p>
        <p>……</p>
        <p>随喜原本在黑暗中沉浮，不知道哪儿来一股吸力，拽着她直直下坠。</p>
        <p>随喜晕头转向的，突然之间，她的五感再一次归位，却不够清晰，模模糊糊的。</p>
        <p>似乎很冷，也很嘈杂，好多人影在眼皮上唰唰闪过，随喜只觉得天旋地转，手脚发软，一点力气都没有。</p>
        <p>她这是才出生吗？</p>
        <p>随喜很想张开眼睛，却怎么也做不到。</p>
        <p>下一瞬，她就睡死过去。</p>
        <p>她不知道的是，自己身边正围着五个人，不顾零下四十度的低温，艰难地做着检查。</p>

        <p>随喜这一觉睡得很长，很沉，醒过来时还有点懵，大脑一片空白。</p>
        <p>连我是谁我在哪儿我要去干什么灵魂三问都问不出来，只能看着前方发呆。</p>

        <p>这种感觉为何那么像她以前做手术被打麻药的后遗症呢。</p>

        <p>随喜眨眨眼睛，可算开始观察周围。</p>
        <p>她在的地方好像是一个封闭的房间，视线范围内是厚厚的水泥墙，地也是水泥地，但铺着一层干稻草，看上去还挺整洁的。</p>
        <p>然后她低下头，瞧见了两只十分眼熟的爪子。</p>

        <p>一看到这个搭配，随喜脑海中立刻蹦出一个名字——老虎。</p>
        <p>她这辈子居然变成了一只老虎！</p>
        <p>不过，单看这只爪子的大小，似乎不是刚出生吧。虽然旁边没有对比参照物，可是基本的尺寸随喜还是能看出来的。</p>
        <p>一个巴掌能盖住的稻草何止几十根。</p>

        <p>随喜本想站起来多观察一下，可刚一抬头，她就感觉力气用光了，啪嗒一下倒了回去。</p>

        <p>行了，不需要再看了，她这辈子的开局好惨，投生到了一只受伤住院的老虎身上。</p>
        <p>比上辈子的开局要倒霉很多，不过换个角度想，虽然受伤了，可已经被救了回来，只要好好养伤就能健康活下去。</p>
        <p>救助站都是好吃的，也不算很倒霉。</p>

        <p>麻药的药效逐渐消失，随喜的后腿愈发疼痛，不过她闻到了药味，说明伤口已经处理过了。</p>

        <p>随喜苦过累过就是没怎么饿过，尤其现在这种饥饿程度也太夸张了，她进食频率最低的时候还一周一顿饭呢。</p>
        <p>或许是她的怨念已经突破天际，随喜听到了沉重的人类脚步声，伴随而来的，还有非常新鲜的食物味道。</p>

        <p>这位饲养员在铁栏杆门地下鼓捣了一会，打开一条长方形的通道，随后把装满肉的铝盆顺着缝隙塞进去。</p>
        <p>她非常谨慎，没有开门，也没有用手，而是用一根长棍子推的。</p>

        <p>饲养员似乎顾及到她现在不太能动，直接把盆推到了她脑袋旁边。</p>
        <p>不得不说，这人力气挺大，一盆肉十多斤，就用小棍顶着，竟然还能推那么精准。</p>

        <p>好贴心！！</p>

        <p>棚顶的四个摄像头全方位无死角拍摄下她大嚼特嚼的画面。</p>
        <p>李教授欣慰地握紧手，“进食意向显著，术后精神状态恢复得也不错，而且罕见对饲养员没有表现出攻击性。”</p>
        <p>大家都以为这头老虎会大发脾气，就算没力气攻击，至少也要哈气威胁一下饲养员，等她走了以后再进食。</p>
        <p>谁曾想它根本没有攻击的意思，只知道吃。</p>
        <p>“也许是太饿了。”来自俄国的专家谢苗·罗曼年科痛心极了，“看看它瘦的……”</p>
        <p>“或许等它吃饱了就有精力哈气了。”他一本正经道。</p>
