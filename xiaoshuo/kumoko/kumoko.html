<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>转生成蜘蛛又怎样</title>
    <link rel="icon" href="../../Images/heiqiushou.ico">
    <link rel="stylesheet" href="epub.css">
    <link rel="stylesheet" href="yuan.css">
    <link rel="stylesheet" href="../../Iconfont/Iconfont1/iconfont.css">
    <link rel="stylesheet" href="../../Iconfont/Iconfont2/iconfont.css">
</head>

<body>
    <!-- 顶部阅读进度线 -->
    <div id="progress-bar"></div>

    <div class="toolbar">
        <div>
            <button id="topBack">
                <svg class="icon" aria-hidden="true">
                    <use xlink:href="#icon-shouye"></use>
                </svg>返回目录</button>
        </div>
        <div class="toolbar-right">
            <button id="btnFontDown" title="缩小字号">A-</button>
            <button id="btnFontUp" title="放大字号">A+</button>
            <button id="btnNight" title="夜间模式">
                <svg class="icon" aria-hidden="true">
                    <use xlink:href="#icon-yueliang"></use>
                </svg>
            </button>
        </div>
    </div>

    <div class="book-header">
        <div class="book-info">
            <div class="b-relative rota fzcuyasong">
                <div>
                    <div class="box1">轉</div>
                    <div class="t-top">生</div>
                    <div class="box2">成</div>
                </div>
                <div class="clear"></div>
                <div class="shadow">
                    <div>
                        <div class="f-right font35">
                            <p class="em08 tt3">又</p>
                            <p class="tt3">怎</p>
                            <p class="tt3">樣</p>
                            <p class="tr tt1">！</p>
                        </div>
                        <div class="font45 f-right tt">蜘蛛</div>
                    </div>
                    <div class="f-right tt2 font12">
                        <p class="font08">作</p>
                        <p class="font08">者</p>
                        <p class="font08">：</p>
                        <p class="font15">馬</p>
                        <p class="font15">場</p>
                        <p class="font15">翁</p>
                    </div>
                    <div class="f-right tt2 font10">
                        <p class="font08">插</p>
                        <p class="font08">畫</p>
                        <p class="font08">：</p>
                        <p class="font15">輝</p>
                        <p class="font15">竜</p>
                        <p class="font15">司</p>
                    </div>
                    <div class="clear"></div>
                </div>
            </div>
        </div>
        <button id="btnClear" title="清除所有章节的阅读进度">
            <svg class="icon" aria-hidden="true">
                <use xlink:href="#icon-tianyuanquan"></use>
            </svg> 清空记录</button>
    </div>

    <ul id="toc"></ul>

    <div id="reader" class="hidden">
        <!-- <div id="volumeLabel" class="volume-label"></div> -->
        <h2 id="chapterTitle"></h2>
        <div id="content"></div>
        <div class="bar">
            <button id="prev">
                <svg class="icon" aria-hidden="true">
                    <use xlink:href="#icon-arrow-left"></use>
                </svg>上一章</button>
            <button id="back">返回目录</button>
            <button id="next">下一章
                <svg class="icon" aria-hidden="true">
                    <use xlink:href="#icon-arrow-right"></use>
                </svg>
            </button>
        </div>
    </div>

</body>
<script src="epub.js" defer></script>
<script src="book.js"></script>
<script src="../../Iconfont/Iconfont2/iconfont.js"></script>
<script src="../../Iconfont/Iconfont1/iconfont.js"></script>

</html>
