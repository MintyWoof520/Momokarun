<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>关于我转生后变成史莱姆这档事</title>
    <link rel="icon" href="../../Images/rimuru.ico">
    <link rel="stylesheet" href="../CSS/tongyong.css">
    <link rel="stylesheet" href="../../Iconfont/Iconfont2/iconfont.css">
</head>

<body>
    <div id="toolbar">
        <button id="modeBtn">
            <i class="iconfont icon0 icon-dingdan"></i><span class="text-hide-mobile">切换滚动</span></button>
        <button id="btnPrev">
            <svg class="icon icon0" aria-hidden="true">
                <use xlink:href="#icon-left-circle-fill"></use>
            </svg>上一章</button>
        <span id="pageInfo">1/1</span>
        <button id="btnNext">下一章
            <svg class="icon icon0" aria-hidden="true">
                <use xlink:href="#icon-right-circle-fill"></use>
            </svg>
        </button>
        <button id="catalogBtn" title="目录">
            <i class="iconfont icon0 icon-caidan"></i><span class="text-hide-mobile">目录</span>
        </button>
    </div>

    <!-- 目录面板：两级结构 -->
    <div id="catalogPanel">
        <div class="catalog-header">
            <span id="catalogTitle">
                章节目录</span>
            <button class="catalog-close" id="catalogClose">✕</button>
        </div>
        <!-- 只需要这一个容器即可，不需要 pageList 了 -->
        <div id="catalogGrid" class="catalog-grid"></div>
    </div>

    <div id="flipContainer">
        <div class="hotzone" id="zonePrev"></div>
        <div class="hotzone" id="zoneNext"></div>
        <div id="imgWrapper">
            <img id="page" alt="漫画页">
        </div>
    </div>

    <!-- 模式 2：滚动 -->
    <div id="scrollContainer"></div>

    <div id="loading">加载中…</div>

    <script>
        const CONFIG = {
            rememberProgress: true,
            chapters: [
                {
                    title: '第1话 死亡~然后转生',
                    total: 24,
                    prefix: 'https://gcore.jsdelivr.net/gh/MintyWoof520/Rimuru@main/1-30/1/',
                    pad: 2,
                    ext: '.jpg'
                }
            ]
        };
    </script>
</body>
<script src="../JS/hua.js"></script>
<script src="../../Iconfont/Iconfont2/iconfont.js"></script>

</html>
