<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>死亡笔记</title>
    <link rel="icon" href="../../Images/jiabushou.ico">
    <link rel="stylesheet" href="../CSS/tongyong.css">
    <link rel="stylesheet" href="../../Iconfont/Iconfont2/iconfont.css">
</head>

<body>

    <div id="toolbar">
        <button id="modeBtn">
            <i class="iconfont icon0 icon-yuedu"></i><span class="text-hide-mobile">切换翻页</span></button>
        <button id="btnPrev">
            <svg class="icon icon0" aria-hidden="true">
                <use xlink:href="#icon-left-circle-fill"></use>
            </svg>上一页</button>
        <span id="pageInfo">1 / 104</span>
        <button id="btnNext">下一页
            <svg class="icon icon0" aria-hidden="true">
                <use xlink:href="#icon-right-circle-fill"></use>
            </svg>
        </button>
        <!-- 新增目录按钮 -->
        <button id="catalogBtn" title="目录">
            <i class="iconfont icon0 icon-caidan"></i><span class="text-hide-mobile">目录</span>
        </button>
    </div>

    <!-- 目录面板 -->
    <div id="catalogPanel">
        <div class="catalog-header">
            <span>
                <svg class="icon icon0" aria-hidden="true">
                    <use xlink:href="#icon-file"></use>
                </svg>章节目录 共104页</span>
            <button class="catalog-close" id="catalogClose">✕</button>
        </div>
        <div class="catalog-grid" id="catalogGrid">
            <!-- JS动态生成页码 -->
        </div>
    </div>

    <div id="flipContainer">
        <div class="hotzone" id="zonePrev"></div>
        <div class="hotzone" id="zoneNext"></div>
        <div id="imgWrapper">
            <img id="page" alt="漫画页">
        </div>
    </div>

    <!-- 模式 2：滚动 -->
    <div id="scrollContainer">
        <!-- 图片将由 JS 动态生成 -->
    </div>

    <div id="loading">加载中…</div>

    <script>
        const CONFIG = {
            rememberProgress: true,
            chapters: [
                {
                    title: '第1-30页',
                    total: 30,
                    start: 1,
                    prefix: 'https://gcore.jsdelivr.net/gh/MintyWoof520/Death-Note@main/juan01/',
                    pad: 2,
                    ext: '.jpg'
                },
                {
                    title: '第31-60页',
                    total: 30,
                    start: 31,
                    prefix: 'https://gcore.jsdelivr.net/gh/MintyWoof520/Death-Note@main/juan01/',
                    pad: 2,
                    ext: '.jpg'
                },
                {
                    title: '第61-90页',
                    total: 30,
                    start: 61,
                    prefix: 'https://gcore.jsdelivr.net/gh/MintyWoof520/Death-Note@main/juan01/',
                    pad: 2,
                    ext: '.jpg'
                },
                {
                    title: '第91-120页',
                    total: 30,
                    start: 91,
                    prefix: 'https://gcore.jsdelivr.net/gh/MintyWoof520/Death-Note@main/juan01/',
                    pad: 2,
                    ext: '.jpg'
                },
                {
                    title: '第121-150页',
                    total: 30,
                    start: 121,
                    prefix: 'https://gcore.jsdelivr.net/gh/MintyWoof520/Death-Note@main/juan01/',
                    pad: 2,
                    ext: '.jpg'
                },
                {
                    title: '第151-194页',
                    total: 44,
                    start: 151,
                    prefix: 'https://gcore.jsdelivr.net/gh/MintyWoof520/Death-Note@main/juan01/',
                    pad: 2,
                    ext: '.jpg'
                },
            ]
        };
    </script>
</body>
<script src="../JS/juan.js"></script>
<script src="../../Iconfont/Iconfont2/iconfont.js"></script>

</html>
