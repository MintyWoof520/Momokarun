<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>超自然武装当哒当</title>
    <link rel="icon" href="../../Images/jiabushou.ico">
    <link rel="stylesheet" href="../CSS/tongyong.css">
    <link rel="stylesheet" href="../../Iconfont/Iconfont2/iconfont.css">
</head>

<body>

    <div id="toolbar">
        <button id="modeBtn">切换到滚动</button>
        <button id="btnFirst" title="第一页">
            <span class="iconfont icon-fast-backward icon0"></span>
        </button>
        <button id="btnPrev">
            <svg class="icon icon0" aria-hidden="true">
                <use xlink:href="#icon-left-circle-fill"></use>
            </svg>上一页</button>
        <span id="pageInfo">1 / 104</span>
        <button id="btnNext">下一页
            <svg class="icon icon0" aria-hidden="true">
                <use xlink:href="#icon-right-circle-fill"></use>
            </svg>
        </button>
        <button id="btnLast" title="最后一页">
            <span class="iconfont icon-fast-forward icon0"></span>
        </button>
    </div>

    <div id="flipContainer">
        <div class="hotzone" id="zonePrev"></div>
        <div class="hotzone" id="zoneNext"></div>
        <div id="imgWrapper">
            <img id="page" alt="漫画页">
        </div>
    </div>

    <!-- 模式 2：滚动 -->
    <div id="scrollContainer">
        <!-- 图片将由 JS 动态生成 -->
    </div>

    <div id="loading">加载中…</div>

    <script>
        const CONFIG = {
            total: 104,
            ext: '.jpg',                                  // .jpg / .webp / .png
            prefix: 'https://comic01-10i3bxv3bn.maozi.io//DANDADAN01/',                             // 可换成完整 URL
            pad: 2,                                       // 文件名补零位数：01.jpg
            rememberProgress: true,                       // 记住上次看到第几页
        };
    </script>
</body>
<script src="../JS/juan1.js"></script>
<script src="../../Iconfont/Iconfont2/iconfont.js"></script>

</html>
