<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>超自然武装当哒当</title>
    <link rel="icon" href="../../Images/momokarun.ico">
    <link rel="stylesheet" href="../CSS/tongyong.css">
    <link rel="stylesheet" href="../../Iconfont/Iconfont2/iconfont.css">
</head>

<body>

    <div id="toolbar">
        <button id="modeBtn">
            <i class="iconfont icon0 icon-yuedu"></i><span class="text-hide-mobile">切换翻页</span></button>
        <button id="btnPrev">
            <svg class="icon icon0" aria-hidden="true">
                <use xlink:href="#icon-left-circle-fill"></use>
            </svg>上一页</button>
        <span id="pageInfo">1 / 20</span>
        <button id="btnNext">下一页
            <svg class="icon icon0" aria-hidden="true">
                <use xlink:href="#icon-right-circle-fill"></use>
            </svg>
        </button>
        <button id="catalogBtn" title="目录">
            <i class="iconfont icon0 icon-caidan"></i><span class="text-hide-mobile">目录</span>
        </button>
    </div>

    <div id="catalogPanel">
        <div class="catalog-header">
            <span>
                <svg class="icon icon0" aria-hidden="true">
                    <use xlink:href="#icon-file"></use>
                </svg>章节目录</span>
            <button class="catalog-close" id="catalogClose">✕</button>
        </div>
        <div class="catalog-grid" id="catalogGrid">
            <!-- JS 动态生成章节列表 -->
        </div>
    </div>

    <div id="flipContainer">
        <div class="hotzone" id="zonePrev"></div>
        <div class="hotzone" id="zoneNext"></div>
        <div id="imgWrapper">
            <img id="page" alt="漫画页">
        </div>
    </div>

    <div id="scrollContainer"></div>

    <div id="loading">加载中…</div>

    <script>
        const CONFIG = {
            rememberProgress: true,
            chapters: [
                {
                    title: '第1-20页',
                    total: 20,
                    start: 1,
                    prefix: 'https://gcore.jsdelivr.net/gh/MintyWoof520/Comic01@main/DANDADAN01/',
                    pad: 2,
                    ext: '.jpg'
                },
                {
                    title: '第21-40页',
                    total: 20,
                    start: 21,
                    prefix: 'https://gcore.jsdelivr.net/gh/MintyWoof520/Comic01@main/DANDADAN01/',
                    pad: 2,
                    ext: '.jpg'
                },
                {
                    title: '第41-60页',
                    total: 20,
                    start: 41,
                    prefix: 'https://gcore.jsdelivr.net/gh/MintyWoof520/Comic01@main/DANDADAN01/',
                    pad: 2,
                    ext: '.jpg'
                },
                {
                    title: '第61-80页',
                    total: 20,
                    start: 61,
                    prefix: 'https://gcore.jsdelivr.net/gh/MintyWoof520/Comic01@main/DANDADAN01/',
                    pad: 2,
                    ext: '.jpg'
                },
                {
                    title: '第81-104页',
                    total: 24,
                    start: 81,
                    prefix: 'https://gcore.jsdelivr.net/gh/MintyWoof520/Comic01@main/DANDADAN01/',
                    pad: 2,
                    ext: '.jpg'
                },
            ]
        };
    </script>
</body>
<script src="../JS/juan.js"></script>
<script src="../../Iconfont/Iconfont2/iconfont.js"></script>

</html>
